name: Test formulas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Check formula style
        run: brew style marcgeld/tap/askafm marcgeld/tap/swol marcgeld/tap/airbag
      - name: Install formulas
        run: brew install marcgeld/tap/askafm marcgeld/tap/swol marcgeld/tap/airbag
      - name: Test formulas
        run: |
          brew test marcgeld/tap/askafm
          brew test marcgeld/tap/swol
          brew test marcgeld/tap/airbag
